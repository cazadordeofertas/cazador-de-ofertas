<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1424"><title>Validar Pase | Club Cazador</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#0c1424;color:#fff;min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(520px,100%);background:#fff;color:#101828;border-radius:22px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.3)}h1{margin:0 0 7px}.sub{color:#667085;font-size:12px;margin-bottom:20px}.field{margin:10px 0}.field label{display:block;font-size:10px;font-weight:900;color:#667085;margin-bottom:4px}.field input{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:12px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:#ff9f1c;color:#101828;font-weight:950;margin-top:8px}.result{display:none;border-radius:13px;padding:15px;margin-top:15px}.result.show{display:block}.result.ok{background:#ecfdf3;border:1px solid #abefc6;color:#027a48}.result.bad{background:#fef3f2;border:1px solid #fecdca;color:#b42318}.note{font-size:9px;color:#98a2b3;margin-top:14px}</style></head><body><main class="panel"><h1>🎯 Validar Pase Cazador</h1><div class="sub">Uso exclusivo de comercios Club Cazador. Cada Pase válido puede utilizarse una sola vez.</div><div class="field"><label>CLAVE DEL COMERCIO</label><input id="key" type="password" autocomplete="off" placeholder="Clave entregada por Cazador"></div><div class="field"><label>PASE / TOKEN</label><input id="token" autocomplete="off" placeholder="CAZADOR:…"></div><div class="field"><label>MONTO DE LA VENTA (opcional)</label><input id="sale" inputmode="numeric" placeholder="$"></div><button class="btn" id="validate">Validar y registrar uso</button><div class="result" id="result"></div><div class="note">La clave del comercio se valida contra un hash seguro y no se almacena en esta página. No compartas la clave con clientes.</div></main><script>const API='https://zhkwnlstzchhqfspbclg.supabase.co/functions/v1/cazador-club-redeem', $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n||0));$('#validate').onclick=async()=>{const b=$('#validate'),r=$('#result'),key=$('#key').value.trim(),token=$('#token').value.trim(),sale=Number($('#sale').value.replace(/[^0-9]/g,''))||null;if(key.length<20||token.length<20){r.className='result show bad';r.textContent='Completa la clave del comercio y el Pase.';return}b.disabled=true;b.textContent='Validando…';try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-club-partner-key':key},body:JSON.stringify({token,sale_amount_clp:sale})}),d=await res.json();if(!res.ok)throw new Error(d.error||'Pase no válido');r.className='result show ok';r.innerHTML=`✅ <b>Pase validado</b><br>${d.benefit||''}${d.customer_savings_clp?`<br>Ahorro registrado: ${money(d.customer_savings_clp)}`:''}`;$('#token').value='';$('#sale').value=''}catch(e){r.className='result show bad';r.textContent='⚠️ '+e.message}finally{b.disabled=false;b.textContent='Validar y registrar uso'}};</script></body></html>
