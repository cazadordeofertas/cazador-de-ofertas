<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1424"><title>Club Cazador</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#f4f6f8;color:#101828}.top{background:#0c1424;color:#fff}.w{max-width:1080px;margin:auto;padding:0 18px}.nav{height:62px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950}.brand span{color:#ffb84d}.back{color:#d0d5dd;text-decoration:none;font-size:12px}.hero{background:linear-gradient(135deg,#0c1424,#1a2b46);color:#fff;padding:45px 0}.hero h1{font-size:clamp(36px,6vw,58px);line-height:1;margin:0 0 10px}.hero p{color:#d0d5dd;max-width:700px}.bar{display:flex;gap:8px;margin-top:18px}.bar input{flex:1;border:0;border-radius:11px;padding:12px}.bar button{border:0;border-radius:11px;background:#ff9f1c;padding:0 15px;font-weight:900}.main{padding:30px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.head p{font-size:12px;color:#667085}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:17px;padding:17px}.type{font-size:10px;font-weight:900;color:#667085;text-transform:uppercase}.card h3{margin:5px 0;font-size:18px}.partner{font-size:12px;font-weight:800;color:#475467}.big{font-size:24px;font-weight:950;color:#b54708;margin:9px 0}.terms{font-size:10px;color:#667085;min-height:30px}.actions{display:flex;gap:7px;margin-top:13px}.actions button,.actions a{flex:1;border-radius:9px;padding:9px;text-align:center;text-decoration:none;font-size:10px;font-weight:900}.use{border:0;background:#0c1424;color:#fff}.link{border:1px solid #d0d5dd;color:#344054}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d0d5dd;border-radius:17px;padding:40px;text-align:center;color:#667085}.modal{position:fixed;inset:0;background:rgba(12,20,36,.72);display:none;place-items:center;padding:16px}.modal.show{display:grid}.panel{background:#fff;border-radius:20px;padding:22px;max-width:430px;width:100%;text-align:center}.token{font-family:monospace;font-size:13px;word-break:break-all;background:#f2f4f7;padding:12px;border-radius:10px;margin:12px 0}.close{border:0;background:#e4e7ec;border-radius:9px;padding:9px 12px;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}.bar{flex-direction:column}.bar button{padding:12px}}</style></head><body><div class="top"><div class="w nav"><div class="brand">🎯 Club <span>Cazador</span></div><a class="back" href="./">Volver a Cazador</a></div></div><section class="hero"><div class="w"><h1>Beneficios para Cazadores.</h1><p>Descuentos exclusivos en comercios y servicios. Sólo mostramos beneficios activos y verificados.</p><div class="bar"><input id="commune" placeholder="Filtra por comuna (opcional)"><button id="search">Buscar beneficios</button></div></div></section><main class="w main"><div class="head"><div><h2>Beneficios disponibles</h2><p>Códigos, precios especiales y Pases Cazador.</p></div><a href="partners.html" style="font-size:11px;font-weight:900;color:#b54708">¿Tienes un comercio?</a></div><div class="grid" id="grid"><div class="empty">Cargando beneficios…</div></div></main><div class="modal" id="modal"><div class="panel"><h2>🎯 Pase Cazador</h2><div id="modalBody"></div><button class="close" id="close">Cerrar</button></div></div><script>const BASE='https://zhkwnlstzchhqfspbclg.supabase.co/functions/v1',ANON='sb_publishable_C_9YScvl92gFkO9RJvWP7w_7A4gwsdo';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n||0));let items=[];function label(x){if(x.benefit_type==='percent')return x.benefit_value+'%';if(x.benefit_type==='fixed')return money(x.benefit_value);if(x.benefit_type==='2x1')return'2x1';if(x.benefit_type==='special_price')return x.cazador_price?money(x.cazador_price):'Precio especial';return x.title}async function call(path,opt={}){const r=await fetch(BASE+path,{...opt,headers:{Authorization:'Bearer '+ANON,apikey:ANON,...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d}async function load(){const c=$('#commune').value.trim();try{const d=await call('/cazador-club'+(c?'?commune='+encodeURIComponent(c):''));items=d.benefits||[];$('#grid').innerHTML=items.length?items.map((x,i)=>`<article class="card"><div class="type">${esc(x.partner_type||'Club Cazador')}</div><h3>${esc(x.title)}</h3><div class="partner">${esc(x.partner_name)}${x.commune?' · '+esc(x.commune):''}</div><div class="big">${esc(label(x))}</div><div class="terms">${esc((x.terms||'Revisa vigencia y condiciones al activar el beneficio').slice(0,180))}${x.sponsored?' · Patrocinado':''}</div><div class="actions"><button class="use" data-use="${i}">${x.redemption_mode==='qr'?'Activar Pase':'Usar beneficio'}</button>${x.website_url?`<a class="link" href="${esc(x.website_url)}" target="_blank" rel="noopener">Sitio</a>`:''}</div></article>`).join(''):'<div class="empty"><b>Aún no hay beneficios publicados en esta zona.</b><br>Cazador sólo mostrará acuerdos reales y verificados.</div>'}catch(e){$('#grid').innerHTML='<div class="empty">No pudimos cargar los beneficios en este momento.</div>'}}async function activate(i){const x=items[i];if(!x)return;try{const d=await call('/cazador-club',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({benefit_id:x.benefit_id})});let h=`<p><b>${esc(x.partner_name)}</b><br>${esc(x.title)}</p>`;if(d.redemption_mode==='qr'){h+=`<p>Muéstrale este Pase al comercio. Vence en 10 minutos.</p><div class="token">${esc(d.qr_payload)}</div><p style="font-size:11px;color:#667085">Un solo uso. No compartas este código.</p>`}else{h+=d.code?`<div class="token">${esc(d.code)}</div>`:`<p>${esc(d.message||'Muestra esta pantalla en el comercio.')}</p>`}$('#modalBody').innerHTML=h;$('#modal').classList.add('show')}catch(e){alert(e.message)}}document.addEventListener('click',e=>{const b=e.target.closest('[data-use]');if(b)activate(Number(b.dataset.use))});$('#search').onclick=load;$('#close').onclick=()=>$('#modal').classList.remove('show');load();</script></body></html>
