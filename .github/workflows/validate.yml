name: Validate Cazador

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check cazador-v2.js
      - name: Validate HTML parse
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          html=Path('index.html').read_text(encoding='utf-8')
          P().feed(html)
          assert 'cazador-v2.js?v=3' in html
          assert 'id="searchForm"' in html
          assert 'id="productList"' in html
          print('HTML OK')
          PY
      - name: Guard against private-key strings in frontend
        run: |
          ! grep -R -E "SUPABASE_SERVICE_ROLE_KEY|MELI_CLIENT_SECRET|WHATSAPP_TOKEN|RESEND_API_KEY|x-cazador-key" index.html cazador-v2.js
